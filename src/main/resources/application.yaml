spring:
  application:
    name: PharmaBackend
  profiles:
    default: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      connect-timeout: 500ms
      timeout: 500ms
  cache:
    redis:
      time-to-live: ${CACHE_TTL:10m}
  jpa:
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
