server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
logging:
  file:
    name: ${LOG_FILE:logs/pharma-backend.log}
  level:
    root: INFO
    org.hibernate.orm.jdbc.bind: OFF
